replicaCount: 1

image:
  repository: n8nio/n8n
  pullPolicy: IfNotPresent
  tag: "2.1.4"

serviceAccount:
  create: true

replica:
  main: 1
  worker: 2

autoscaling:
  enabled: false

resources:
  main:
    requests:
      memory: 250Mi
    limits:
      memory: 300Mi
  worker:
    requests:
      memory: 400Mi
    limits:
      memory: 400Mi

tolerations: []

affinity: {}
