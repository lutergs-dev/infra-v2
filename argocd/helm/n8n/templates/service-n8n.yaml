apiVersion: v1
kind: Service
metadata:
  name: {{ include "n8n.fullname" . }}-service
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
    n8n.type: main
spec:
  type: ClusterIP
  ports:
    - name: api
      protocol: TCP
      port: 5678
      targetPort: 5678
  selector:
    {{- include "n8n.selectorLabels" . | nindent 4 }}
    n8n.type: main
