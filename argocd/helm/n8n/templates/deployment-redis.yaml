apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      serviceAccountName: {{ include "n8n.serviceAccountName" . }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        fsGroup: 1001
        fsGroupChangePolicy: "Always"
      initContainers:
        - name: init-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eux
              mkdir -p /data/appendonlydir
              # Longhorn 볼륨이 root:root로 잡히는 케이스를 강제로 맞춤
              chown -R 1001:1001 /data
              chmod -R u+rwX,g+rwX /data
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: redis
          image: redis:8.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
          args:
            - "redis-server"
            - "--dir"
            - "/data"
            - "--appendonly"
            - "yes"
            - "--appenddirname"
            - "appendonlydir"
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "redis-cli shutdown || true; sleep 5"]
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-redis

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  labels:
    app: redis
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: redis