apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ente-photo.fullname" . }}
  labels:
    {{- include "ente-photo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ente-photo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ente-photo.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ente-photo.serviceAccountName" . }}
      volumes:
        - name: shared-config-volume
      initContainers:
        - name: init-config
          image: busybox
          command:
            - sh
            - -c
            - |
              cat <<EOF > /data/museum.yaml
              key:
                encryption: $KEY_ENCRYPTION
                hash: $KEY_HASH
              jwt:
                secret: $JWT_SECRET
              apps:
                public-albums: $APPS_PUBLIC_ALBUMS
                cast: $APPS_CAST
                accounts: $APPS_ACCOUNTS
                auth: $APPS_AUTH
              EOF

              cat <<EOF > /data/credentials.yaml
              db:
                host: postgresql.ente.svc.cluster.local
                port: 5432
                name: ente_db
                user: postgres
                password: $POSTGRESQL_PASSWORD
              s3:
                are_local_buckets: false
                use_path_style_urls: true
                b2-eu-cen:
                  key: $S3_ACCESS_KEY
                  secret: $S3_ACCESS_SECRET
                  endpoint: $S3_ENDPOINT
                  region: $S3_REGION
                  bucket: $S3_BUCKET
              EOF

          env:
            - name: KEY_ENCRYPTION
              valueFrom:
                secretKeyRef:
                  name: museum-key-jwt-secret
                  key: key-encryption
            - name: KEY_HASH
              valueFrom:
                secretKeyRef:
                  name: museum-key-jwt-secret
                  key: key-hash
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: museum-key-jwt-secret
                  key: jwt-secret
            - name: APPS_PUBLIC_ALBUMS
              valueFrom:
                secretKeyRef:
                  name: {{ include "ente-photo.name" . }}-apps-url-secret
                  key: PUBLIC_ALBUM_URL
            - name: APPS_CAST
              valueFrom:
                secretKeyRef:
                  name: {{ include "ente-photo.name" . }}-apps-url-secret
                  key: CAST_URL
            - name: APPS_ACCOUNTS
              valueFrom:
                secretKeyRef:
                  name: {{ include "ente-photo.name" . }}-apps-url-secret
                  key: ACCOUNT_URL
            - name: APPS_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "ente-photo.name" . }}-apps-url-secret
                  key: AUTH_URL
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: postgres-password
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-secret
                  key: aws-access-key
            - name: S3_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: s3-secret
                  key: aws-access-secret
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: s3-secret
                  key: aws-s3-endpoint
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: s3-secret
                  key: aws-s3-region
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: s3-secret
                  key: aws-s3-bucket
          volumeMounts:
            - mountPath: shared-config-volume
              name: /data
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /museum.yaml
              name: shared-config-volume
              subPath: museum.yaml
            - mountPath: /credentials.yaml
              name: shared-config-volume
              subPath: credentials.yaml
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
