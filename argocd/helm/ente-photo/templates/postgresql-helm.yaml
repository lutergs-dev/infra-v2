apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: oci://registry-1.docker.io/bitnamicharts/postgresql
    chart: postgresql
    targetRevision: 16.6.0
    helm:
      values: |
        global:
          defaultStorageClass: {{ .Values.postgresql.storageClass }}
          postgresql:
            auth:
              existingSecret: postgresql-secret

        primary:
          persistence:
            enabled: true
            size: {{ .Values.postgresql.size }}
            storageClass: {{ .Values.postgresql.storageClass }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Release.Namespace }}
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
