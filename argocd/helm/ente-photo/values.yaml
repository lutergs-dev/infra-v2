# Default values for ente-photo.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


url:
  publicAlbums: https://ente-albums.lutergs.dev
  cast: https://ente-cast.lutergs.dev
  accounts: https://ente-accounts.lutergs.dev
  auth: https://ente-auth.lutergs.dev

replicaCount: 1

image:
  repository: ghcr.io/ente-io/server
  pullPolicy: IfNotPresent
  tag: "f4875653987a6c83fb51a4a4ec252c8ff82b6c7d"   # 2025.03.15 version

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 0.4
    memory: 1000Mi

webapp:
  replicaCount: 1

nodeSelector: {}

tolerations: []

affinity: {}
