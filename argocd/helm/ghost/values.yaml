# Default values for ghost.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


replicaCount: 1

url:
  default: "https://blog.lutergs.dev"
  admin: "https://blog-admin.lutergs.dev"

mail:
  from: "'LuterGS' <lutergs@lutergs.dev>"

image:
  repository: ghost
  pullPolicy: IfNotPresent
  tag: "6.0.2"   # 2025.08.13 version

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

resources:
  requests:
    cpu: 0.4
    memory: 1000Mi

webapp:
  replicaCount: 1

nodeSelector: {}

tolerations: []

affinity: {}
