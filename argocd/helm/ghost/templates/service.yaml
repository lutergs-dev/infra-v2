apiVersion: v1
kind: Service
metadata:
  name: {{ include "ghost.fullname" . }}-service
  labels:
    {{- include "ghost.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: api
      protocol: TCP
      port: 2368
      targetPort: 2368
  selector:
    {{- include "ghost.selectorLabels" . | nindent 4 }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ghost.fullname" . }}-admin-service
  labels:
    {{- include "ghost.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: api
      protocol: TCP
      port: 2368
      targetPort: 2368
  selector:
    {{- include "ghost.selectorLabels" . | nindent 4 }}
