apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ghost.fullname" . }}-http-route
spec:
  parentRefs:
    - name: gateway
      namespace: nginx-gateway
      sectionName: ghost-blog-listener
  hostnames:
    - blog.lutergs.dev
  rules:
    - backendRefs:
        - name: {{ include "ghost.fullname" . }}-service
          port: 2368
