apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "local-proxy.fullname" . }}-proxy-config
  labels:
    {{- include "local-proxy.labels" . | nindent 4 }}
data:
  default.conf: |
    # Upstream에서 받은 X-Forwarded-Proto가 없으면 https로 fallback
    map $http_x_forwarded_proto $forwarded_proto {
      default $http_x_forwarded_proto;
      ''      https;
    }

    server {
      listen 80 default_server;
      listen [::]:80 default_server;
      server_name _;

      location / {
        proxy_pass {{ .Values.proxy.target.url }};

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Gateway에서 받은 프로토콜 사용, 없으면 https (외부 접근은 항상 HTTPS이므로)
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # 쿠키 전달 설정 (OAuth2 세션 유지를 위해 필수)
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        # 쿠키 도메인 변환 방지
        proxy_cookie_domain off;
        proxy_cookie_path / /;

        # WebSocket 업그레이드
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";

        proxy_buffering     off;
      }
    }