apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "local-proxy.fullname" . }}-http-route
  labels:
    {{- include "local-proxy.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: gateway
      namespace: nginx-gateway
      sectionName: home-assistant-proxy-listener
  hostnames:
    - home-assistant.lutergs.dev
  rules:
    - backendRefs:
        - name: {{ include "local-proxy.fullname" . }}-service
          port: 80
