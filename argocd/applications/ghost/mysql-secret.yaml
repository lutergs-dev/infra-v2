apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ghost-mysql-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/lutergs-dev/infra-v2.git
    targetRevision: main
    path: argocd/manifests/ghost-mysql
  destination:
    server: https://kubernetes.default.svc
    namespace: ghost
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
