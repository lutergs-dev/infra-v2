apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://charts.goauthentik.io
    chart: authentik
    targetRevision: 2025.8.3
    helm:
      values: |
        authentik:
          postgresql:
            host: authentik-postgresql-rw.authentik.svc.cluster.local
        server:
          volumes:
            - name: postgres-creds
              secret:
                secretName: pg-secret
          volumeMounts:
            - name: postgres-creds
              mountPath: /postgres-creds
              readOnly: true
          ingress:
            ingressClassName: nginx
            enabled: true
            hosts:
              - authentik.lutergs.dev
        
        worker:
          volumes:
            - name: postgres-creds
              secret:
                secretName: pg-secret
          volumeMounts:
            - name: postgres-creds
              mountPath: /postgres-creds
              readOnly: true
        redis:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
