apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://charts.goauthentik.io
    chart: authentik
    targetRevision: 2025.10.2
    helm:
      values: |
        authentik:
          secret_key: X1FyHgYNRHGMYK2DxbAwzSMJzSxDKu+cAFpX0zqaSBP8d0ry//ekjROsDq67xnifsHebVXSS4a+c/zQd
          postgresql:
            host: authentik-postgresql-rw.authentik.svc.cluster.local
            user: file:///postgres-creds/username
            password: file:///postgres-creds/password
        server:
          volumes:
            - name: postgres-creds
              secret:
                secretName: pg-secret
          volumeMounts:
            - name: postgres-creds
              mountPath: /postgres-creds
              readOnly: true
        
        worker:
          volumes:
            - name: postgres-creds
              secret:
                secretName: pg-secret
          volumeMounts:
            - name: postgres-creds
              mountPath: /postgres-creds
              readOnly: true
        redis:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
