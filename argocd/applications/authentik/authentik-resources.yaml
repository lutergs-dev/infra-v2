apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik-resources
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/lutergs-dev/infra-v2.git
    targetRevision: main
    path: argocd/manifests/authentik-resources
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
