apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server-httproute
  namespace: argocd
spec:
  parentRefs:
    - name: gateway
      namespace: nginx-gateway
      sectionName: argocd-listener
  hostnames:
    - argocd.lutergs.dev
  rules:
    - backendRefs:
        - name: argocd-server
          port: 443
