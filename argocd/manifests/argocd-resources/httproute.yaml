apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server-httproute
  namespace: argocd
spec:
  parentRefs:
    - name: gateway
      namespace: nginx-gateway
      sectionName: argocd-listener
  hostnames:
    - argocd.lutergs.dev
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Forwarded-Proto
                value: https
              - name: X-Forwarded-Host
                value: argocd.lutergs.dev
              - name: X-Forwarded-Port
                value: "443"
      backendRefs:
        - name: argocd-server
          port: 80
