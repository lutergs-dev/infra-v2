apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-postgresql
  namespace: authentik
spec:
  instances: 1

  backup:
    target: primary     # always trigger backup on primary
    retentionPolicy: 30d

  clusterImageCatalogRef:
    major: 17

  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: pg-secret

  storage:
    size: 50Gi
    storageClass: longhorn
