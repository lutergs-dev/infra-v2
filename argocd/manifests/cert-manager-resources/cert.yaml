apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lutergs-https-cert
  namespace: nginx-gateway
spec:
  secretName: lutergs-https-tls
  dnsNames:
    - photo.lutergs.dev
    - ente.lutergs.dev
    - ente-photos.lutergs.dev
    - ente-accounts.lutergs.dev
    - ente-auth.lutergs.dev
    - ente-cast.lutergs.dev
    - ente-albums.lutergs.dev
    - blog.lutergs.dev
    - blog-admin.lutergs.dev
    - authentik.lutergs.dev
    - argocd.lutergs.dev
    - longhorn.lutergs.dev
  issuerRef:
    name: cloudflare-issuer
    kind: ClusterIssuer
    group: cert-manager.io