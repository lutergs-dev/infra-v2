apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lutergs-https-cert
  namespace: nginx-gateway
spec:
  secretName: lutergs-https-tls
  dnsNames:
    - photo.lutergs.dev
    - blog.lutergs.dev
    - blog-admin.lutergs.dev
    - argocd.lutergs.dev
    - longhorn.lutergs.dev
    - home-assistant.lutergs.dev
  issuerRef:
    name: cloudflare-issuer
    kind: ClusterIssuer
    group: cert-manager.io
